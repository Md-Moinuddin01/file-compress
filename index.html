<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAAAA File Press - The World's Most Dramatic File Crusher</title>
  <meta name="description" content="Upload any file, watch the cartoon piston slam down, hear the legendary FAAAA sound, and download your gzipped compressed file!">
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Fullscreen Particle / Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Top Utilities Bar -->
  <div class="top-bar">
    <div class="brand-badge">
      <span>⚡ 100% CLIENT-SIDE SQUASHER</span>
    </div>
    <button class="sound-toggle-btn" id="soundToggleBtn" aria-label="Toggle Sound Effects">
      <span id="soundIcon">🔊</span>
      <span id="soundText">Sound ON</span>
    </button>
  </div>

  <div class="container">
    <!-- Header Hero -->
    <header>
      <div class="headline-slogan">Upload it. Press it. FAAAA it.</div>
      <h1 class="main-title">FAAAA File Press</h1>
      <p class="subtitle">The internet's only hydraulically-powered, high-decibel cartoon file compressor. Zero servers, pure compression bliss.</p>
    </header>

    
    <!-- Soundboard Controls -->
    <section class="soundboard-box" aria-label="Funny Meme Soundboard">
      <div class="soundboard-header">
        <div class="soundboard-title">
          <span>🔊</span> INSTANT MEME SOUNDBOARD
        </div>
        <div class="soundboard-hint">Web Audio Synthesized</div>
      </div>
      <div class="sound-buttons-grid">
        <button class="sound-btn faaa" data-sound="faaa">
          <span class="btn-icon">📢</span>
          <span>FAAAA!</span>
        </button>
        <button class="sound-btn boing" data-sound="boing">
          <span class="btn-icon">🦘</span>
          <span>BOING</span>
        </button>
        <button class="sound-btn bruh" data-sound="bruh">
          <span class="btn-icon">🗿</span>
          <span>BRUH-O</span>
        </button>
        <button class="sound-btn splat" data-sound="splat">
          <span class="btn-icon">💥</span>
          <span>SPLAT</span>
        </button>
        <button class="sound-btn wow" data-sound="wow">
          <span class="btn-icon">😲</span>
          <span>WOW</span>
        </button>
        <button class="sound-btn laugh" data-sound="laugh">
          <span class="btn-icon">😂</span>
          <span>LAUGH</span>
        </button>
      </div>
    </section>
